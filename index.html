<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Photo Puzzles</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <button id="open" type="button">Choose photo…</button>
      <input id="file" type="file" accept="image/*" hidden />
      <label>Pieces <input id="pieces" type="range" min="6" max="60" value="16" /> <output id="piecesOut">16</output></label>
      <label><input id="irregular" type="checkbox" checked /> Irregular</label>
      <label>Seed <input id="seed" type="text" size="9" maxlength="12" spellcheck="false" /></label>
      <button id="reroll" type="button">Reroll</button>
      <span id="status" aria-live="polite"></span>
    </header>
    <main><canvas id="board"></canvas></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
