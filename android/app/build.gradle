plugins {
    id 'com.android.application'
}

// What is local to this machine and is not kept in the repository (android/local.properties, or -P on the command line): the AdMob ids and the release signing. See android/README.md.
def local = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) localFile.withInputStream { local.load(it) }
def keystore = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) keystoreFile.withInputStream { keystore.load(it) }

// Google's own ids for testing: the ads shown with them are test ads, which earn nothing and cannot get the account into trouble for clicking them.
def TEST_APP_ID = 'ca-app-pub-3940256099942544~3347511713'
def TEST_REWARDED_UNIT = 'ca-app-pub-3940256099942544/5224354917'
def admobAppId = (project.findProperty('admobAppId') ?: local.getProperty('admob.appId')) ?: TEST_APP_ID
// The ad unit follows the stage whose web build is packed in the app (scripts/android-web.mjs leaves it in android/web-stage.txt; -PwebStage overrides): the dev unit's callback address is the
// dev server's and the prod unit's the real one, so each app is paid for by the server it talks to. admob.rewardedUnit.dev / .prod; admob.rewardedUnit alone serves every stage.
def stageFile = rootProject.file('web-stage.txt')
def webStage = (project.findProperty('webStage') ?: (stageFile.exists() ? stageFile.text.trim() : '')) ?: 'dev'
def admobRewardedUnit = (project.findProperty('admobRewardedUnit') ?: local.getProperty("admob.rewardedUnit.${webStage}") ?: local.getProperty('admob.rewardedUnit')) ?: TEST_REWARDED_UNIT
// the phones (and emulators) that are shown test ads even with the real ad unit, so that its own ads are never watched or clicked by the developer: a comma-separated list of the ids that the ad SDK names in the log
def admobTestDevices = (project.findProperty('admobTestDevices') ?: local.getProperty('admob.testDevices')) ?: ''

android {
    namespace "com.tempest.photopuzzles"
    compileSdk 36

    defaultConfig {
        // the dev build is an app of its own, so that it can sit beside the real one on a phone: its own package id (and so its own storage), name and sign-in return address
        applicationId webStage == 'dev' ? "com.tempest.photopuzzles.dev" : "com.tempest.photopuzzles"
        minSdk 24
        targetSdk 36
        // the workflow (.github/workflows/android.yml) sets both: the version code is the run number plus 10, because every upload to the Play Console needs a higher one
        versionCode Integer.parseInt((project.findProperty("versionCode") ?: "1").toString())
        versionName (project.findProperty("versionName") ?: "0.1")
        manifestPlaceholders = [admobAppId: admobAppId, appLabel: webStage == 'dev' ? 'Dev PuzzleVidio' : 'PuzzleVidio']
        buildConfigField 'String', 'ADMOB_REWARDED_UNIT', "\"${admobRewardedUnit}\""
        buildConfigField 'String', 'ADMOB_TEST_DEVICES', "\"${admobTestDevices}\""
        // Play Games achievements are for the real app only: the dev app's package id is not registered in the Play Console
        buildConfigField 'boolean', 'GAMES_ENABLED', webStage == 'dev' ? 'false' : 'true'
    }
    buildFeatures {
        buildConfig true
    }
    signingConfigs {
        // the debug (dev) build is signed with the key kept in the repository (android/dev.keystore, with the password `android`: it is no secret, it only has to be the same on every machine and in the
        // workflow, so that a phone installs each new dev build over the one before; Android refuses an update signed with another key)
        debug {
            storeFile rootProject.file('dev.keystore')
            storePassword 'android'
            keyAlias 'dev'
            keyPassword 'android'
        }
        // for the store: the key and its passwords are in android/keystore.properties, which is not kept in the repository (storeFile, storePassword, keyAlias, keyPassword)
        if (keystoreFile.exists()) {
            release {
                storeFile rootProject.file(keystore.getProperty('storeFile'))
                storePassword keystore.getProperty('storePassword')
                keyAlias keystore.getProperty('keyAlias')
                keyPassword keystore.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            // without a key of its own: private builds only, signed with the debug key so that one APK installs on every device
            signingConfig keystoreFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // the web build is stored as it is (not compressed again): it is already minified
    androidResources { noCompress 'js', 'css', 'html' }
    lint {
        abortOnError false
    }
}

dependencies {
    // rewarded ads (AdMob), and Google's consent form for them, which the law asks for in the EEA and the UK
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    // the phone's browser, opened inside the app: where signing in with Google happens (Google does not let its page open in an app's web view)
    implementation 'androidx.browser:browser:1.8.0'
    // achievements (Google Play Games Services)
    implementation 'com.google.android.gms:play-services-games-v2:21.0.0'
}

// A release build must not carry the test ids: its ads would earn nothing. (-PallowTestAds for a private build that is only to be looked at.)
gradle.taskGraph.whenReady { graph ->
    def release = graph.allTasks.any { it.name in ['assembleRelease', 'bundleRelease', 'packageRelease'] }
    if (release && (admobAppId == TEST_APP_ID || admobRewardedUnit == TEST_REWARDED_UNIT) && !project.hasProperty('allowTestAds')) {
        throw new GradleException('A release build needs the real AdMob ids: admob.appId and admob.rewardedUnit.' + webStage + ' (or admob.rewardedUnit) in android/local.properties (or -PadmobAppId and -PadmobRewardedUnit). For a private build with test ads, add -PallowTestAds.')
    }
}
