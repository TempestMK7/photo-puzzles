name: Deploy

# Dev is deployed by itself: every change that is merged into main is tested and then put on dev.puzzlevid.io (a change that only touches documents is not).
# Production is deployed by hand only: Actions > Deploy > Run workflow, choose "prod" and type the word prod in the box (so that it cannot be a slip). Either one can also be run by hand
# for dev. It runs from main only, and signs in to AWS through OIDC (no stored keys).
# The repository needs these variables (Settings > Secrets and variables > Actions > Variables); see infra/README.md:
#   AWS_DEPLOY_ROLE_ARN  the role that the Ops stack made
#   HOSTED_ZONE_ID       the hosted zone of the domain
# and may have: ALERT_EMAIL, GOOGLE_CLIENT_ID, GOOGLE_SECRET_NAME, LIMITS (JSON, like {"freeRoomsPerWeek":0}: see docs/runbook.md)
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
    inputs:
      stage:
        description: Which deployment
        type: choice
        options: [dev, prod]
        default: dev
      confirm:
        description: 'For prod only: type the word prod'
        type: string
        default: ''

permissions:
  id-token: write
  contents: read

# one deployment of a stage at a time; a second one waits (and of several that wait, only the newest is kept)
concurrency:
  group: deploy-${{ inputs.stage || 'dev' }}

jobs:
  verify:
    name: Tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Production has to be asked for
        if: inputs.stage == 'prod' && inputs.confirm != 'prod'
        run: |
          echo "::error::To deploy production, type the word prod in the box 'For prod only'."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit

  deploy:
    name: Deploy ${{ inputs.stage || 'dev' }}
    needs: verify
    runs-on: ubuntu-latest
    env:
      STAGE: ${{ inputs.stage || 'dev' }}
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/package-lock.json
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy the stacks
        working-directory: infra
        env:
          CTX_ZONE: ${{ vars.HOSTED_ZONE_ID }}
          CTX_EMAIL: ${{ vars.ALERT_EMAIL }}
          CTX_GOOGLE_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          CTX_GOOGLE_SECRET: ${{ vars.GOOGLE_SECRET_NAME }}
          CTX_LIMITS: ${{ vars.LIMITS }}
        run: |
          npm ci --prefix ..
          npm ci
          npx cdk deploy "PuzzleVidio-$STAGE-*" --require-approval never \
            -c "hostedZoneId=$CTX_ZONE" -c "alertEmail=$CTX_EMAIL" -c "googleClientId=$CTX_GOOGLE_ID" -c "googleSecretName=$CTX_GOOGLE_SECRET" -c "limits=$CTX_LIMITS"

      # Where everything is, from what the stacks said, goes into the build of the game (none of it is secret: it is in the page that every visitor gets).
      - name: Find where everything is
        env:
          GOOGLE_ON: ${{ vars.GOOGLE_CLIENT_ID != '' && vars.GOOGLE_SECRET_NAME != '' && 'yes' || '' }}
        run: |
          out() { aws cloudformation describe-stacks --stack-name "PuzzleVidio-$STAGE-$1" --query "Stacks[0].Outputs[?OutputKey=='$2'].OutputValue" --output text; }
          {
            echo "VITE_ONLINE_URL=$(out Api Address)"
            echo "VITE_IOT_ENDPOINT=$(out Live IotEndpoint)"
            echo "VITE_IOT_AUTHORIZER=$(out Live AuthorizerName)"
            echo "VITE_COGNITO_HOST=$(out Auth SignInHost)"
            echo "VITE_COGNITO_CLIENT_ID=$(out Auth ClientId)"
            echo "VITE_GOOGLE_SIGNIN=$GOOGLE_ON"
          } >> "$GITHUB_ENV"

      # The build says which one it is (src/version.ts): the number of this run, the commit (vite.config.ts reads GITHUB_SHA), and the stage.
      - name: Build the game
        env:
          VITE_BUILD: ${{ github.run_number }}
          VITE_STAGE: ${{ env.STAGE }}
        run: npm run build

      - name: Put the game in place
        run: |
          out() { aws cloudformation describe-stacks --stack-name "PuzzleVidio-$STAGE-Web" --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          BUCKET=$(out SiteBucket)
          DIST=$(out DistributionId)
          # Files with a hash in their name never change; the page itself must be fetched again every time.
          aws s3 sync dist "s3://$BUCKET" --delete --exclude index.html --cache-control "public,max-age=31536000,immutable"
          aws s3 cp dist/index.html "s3://$BUCKET/index.html" --cache-control "no-cache"
          aws cloudfront create-invalidation --distribution-id "$DIST" --paths "/*"
          echo "Deployed $STAGE: build ${{ github.run_number }}, commit ${GITHUB_SHA::7}, $(out Address)" >> "$GITHUB_STEP_SUMMARY"
