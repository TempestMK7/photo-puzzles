name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  game:
    name: Game and server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build

  infra:
    name: Infrastructure
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/package-lock.json
      # the functions are bundled from the code in server/, which needs the dependencies of the game's own project
      - run: npm ci
        working-directory: .
      - run: npm ci
      - run: npm run check
      - run: npm test
      # Builds every template and bundles the functions, with a made-up hosted zone: no AWS account is needed.
      - run: npx cdk synth --quiet -c hostedZoneId=ZEXAMPLE

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      # the game's web build goes into the app (no online play: nothing here knows where a server is), then the app is built with Google's test ad ids
      - run: node scripts/android-web.mjs offline
      - run: ./gradlew assembleDebug --console=plain
        working-directory: android
